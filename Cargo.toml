[workspace]
members = [".", "rusty_sand_hooks", "crates/protocol"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
rusty_sand_protocol = { path = "crates/protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows = "0.52"

[package]
name = "rusty_sand"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
authors = ["GuestAUser"]
description = "Windows executable monitoring and security analysis"
license.workspace = true

[dependencies]
rusty_sand_protocol.workspace = true
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "cargo", "wrap_help"] }
log = "0.4"
serde.workspace = true
serde_json.workspace = true
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
env_logger = "0.11"
notify = "6.1"
sysinfo = "0.30"
tokio = { version = "1.0", features = ["full"] }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
