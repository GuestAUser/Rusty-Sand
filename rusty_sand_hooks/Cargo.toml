[package]
name = "rusty_sand_hooks"
version = "0.2.5"
edition = "2021"
authors = ["Security Research Team"]
description = "API hooking DLL for Rusty Sand sandbox"

[lib]
crate-type = ["cdylib"]

[dependencies]
# API Hooking - MinHook for real inline hooks (stable Rust compatible)
minhook = "0.8"
once_cell = "1.19"
parking_lot = "0.12"

# Serialization for IPC
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Windows API
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_Networking_WinSock",
    "Win32_System_Memory",
] }

# Logging
log = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
